services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: swim
      POSTGRES_PASSWORD: swim
      POSTGRES_DB: swim_scheduler
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swim -d swim_scheduler"]
      interval: 5s
      timeout: 5s
      retries: 12
