name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SWIM_ENV: test
  SWIM_ENABLE_DEMO_DATA: "true"
  SWIM_ENABLE_DEMO_AUTH: "true"
  SWIM_DATABASE_URL: postgresql+psycopg://swim:swim@127.0.0.1:5432/swim_scheduler
  SWIM_TEST_DATABASE_URL: postgresql+psycopg://swim:swim@127.0.0.1:5432/swim_scheduler_test
  SWIM_REQUIRE_POSTGRES_TESTS: "true"

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: swim
          POSTGRES_PASSWORD: swim
          POSTGRES_DB: swim_scheduler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swim -d swim_scheduler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Create test database
        run: >-
          python -c "import psycopg;
          conn = psycopg.connect('postgresql://swim:swim@127.0.0.1:5432/swim_scheduler', autocommit=True);
          conn.execute('CREATE DATABASE swim_scheduler_test')"

      - name: Apply Alembic migrations
        run: alembic upgrade head

      - name: Run Python tests
        run: python -m pytest -q -m "not integration and not e2e"

      - name: Run Postgres-backed integration tests
        run: python -m pytest -q -m integration

      - name: Check API contracts
        run: python scripts/export_contracts.py --check

      - name: Start FastAPI
        run: |
          python -m uvicorn app.api:app --host 127.0.0.1 --port 8000 > /tmp/swim-api.log 2>&1 &
          python - <<'PY'
          import time
          import urllib.request

          for _ in range(40):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("FastAPI did not become healthy")
          PY

      - name: Run API e2e smoke tests
        env:
          SWIM_E2E_BASE_URL: http://127.0.0.1:8000
        run: python -m pytest -q -m e2e

  frontends:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: swim
          POSTGRES_PASSWORD: swim
          POSTGRES_DB: swim_scheduler
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swim -d swim_scheduler"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend-instructor-command/package-lock.json
            frontend-client-invite/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Create test database
        run: >-
          python -c "import psycopg;
          conn = psycopg.connect('postgresql://swim:swim@127.0.0.1:5432/swim_scheduler', autocommit=True);
          conn.execute('CREATE DATABASE swim_scheduler_test')"

      - name: Apply Alembic migrations
        run: alembic upgrade head

      - name: Install instructor frontend
        working-directory: frontend-instructor-command
        run: npm ci

      - name: Install client invite frontend
        working-directory: frontend-client-invite
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend-client-invite
        run: npx playwright install --with-deps chromium

      - name: Run instructor unit tests
        working-directory: frontend-instructor-command
        run: npm test

      - name: Run client invite unit tests
        working-directory: frontend-client-invite
        run: npm run test:unit

      - name: Reject unsafe instructor production builds
        working-directory: frontend-instructor-command
        run: |
          set +e
          env -u VITE_USE_MOCK_API -u VITE_INSTRUCTOR_API_URL npm run build > "$RUNNER_TEMP/instructor-unconfigured-build.log" 2>&1
          instructor_unconfigured_status=$?
          env -u VITE_INSTRUCTOR_API_URL VITE_USE_MOCK_API=true npm run build > "$RUNNER_TEMP/instructor-mock-build.log" 2>&1
          instructor_mock_status=$?
          set -e
          cat "$RUNNER_TEMP/instructor-unconfigured-build.log"
          cat "$RUNNER_TEMP/instructor-mock-build.log"
          if [ "$instructor_unconfigured_status" -eq 0 ] || [ "$instructor_mock_status" -eq 0 ]; then
            echo "Instructor production build accepted unsafe data-mode configuration."
            exit 1
          fi
          grep -q "VITE_INSTRUCTOR_API_URL" "$RUNNER_TEMP/instructor-unconfigured-build.log"

      - name: Reject unsafe client invite production builds
        working-directory: frontend-client-invite
        run: |
          set +e
          env -u VITE_USE_MOCK_API -u VITE_CLIENT_INVITE_API_URL npm run build > "$RUNNER_TEMP/client-unconfigured-build.log" 2>&1
          client_unconfigured_status=$?
          env -u VITE_CLIENT_INVITE_API_URL VITE_USE_MOCK_API=true npm run build > "$RUNNER_TEMP/client-mock-build.log" 2>&1
          client_mock_status=$?
          set -e
          cat "$RUNNER_TEMP/client-unconfigured-build.log"
          cat "$RUNNER_TEMP/client-mock-build.log"
          if [ "$client_unconfigured_status" -eq 0 ] || [ "$client_mock_status" -eq 0 ]; then
            echo "Client invite production build accepted unsafe data-mode configuration."
            exit 1
          fi
          grep -q "VITE_CLIENT_INVITE_API_URL" "$RUNNER_TEMP/client-unconfigured-build.log"

      - name: Build instructor frontend
        working-directory: frontend-instructor-command
        env:
          VITE_USE_MOCK_API: "false"
          VITE_INSTRUCTOR_API_URL: /api
        run: npm run build

      - name: Build client invite frontend
        working-directory: frontend-client-invite
        env:
          VITE_USE_MOCK_API: "false"
          VITE_CLIENT_INVITE_API_URL: /api/public
        run: npm run build

      - name: Run instructor Playwright smoke tests
        working-directory: frontend-instructor-command
        env:
          VITE_USE_MOCK_API: "true"
          VITE_INSTRUCTOR_API_URL: ""
        run: npm run test:e2e

      - name: Run instructor auth Playwright smoke tests
        working-directory: frontend-instructor-command
        env:
          VITE_USE_MOCK_API: "false"
        run: npm run test:e2e:auth

      - name: Run client invite Playwright smoke tests
        working-directory: frontend-client-invite
        env:
          VITE_USE_MOCK_API: "true"
          VITE_CLIENT_INVITE_API_URL: ""
        run: npm run test:e2e

      - name: Start FastAPI
        run: |
          python -m uvicorn app.api:app --host 127.0.0.1 --port 8000 > /tmp/swim-api.log 2>&1 &
          python - <<'PY'
          import time
          import urllib.request

          for _ in range(40):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("FastAPI did not become healthy")
          PY

      - name: Run instructor live-backend Playwright smoke tests
        working-directory: frontend-instructor-command
        env:
          VITE_USE_MOCK_API: "false"
          VITE_INSTRUCTOR_API_URL: http://127.0.0.1:8000/api
        run: npm run test:e2e:live

      - name: Run client invite live-backend Playwright smoke tests
        working-directory: frontend-client-invite
        env:
          VITE_USE_MOCK_API: "false"
          VITE_CLIENT_INVITE_API_URL: http://127.0.0.1:8000/api/public
        run: npm run test:e2e:live

  merge-gate:
    name: merge-gate
    if: ${{ always() }}
    needs:
      - backend
      - frontends
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Require every CI job to succeed
        shell: bash
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTENDS_RESULT: ${{ needs.frontends.result }}
        run: |
          set -euo pipefail
          printf 'backend=%s\nfrontends=%s\n' \
            "$BACKEND_RESULT" "$FRONTENDS_RESULT"

          [[ "$BACKEND_RESULT" == "success" ]]
          [[ "$FRONTENDS_RESULT" == "success" ]]
